<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src https://ntfy.sh; base-uri 'none'; form-action 'none'">
<meta name="robots" content="noindex"><title>HomeTV – Link senden</title><link rel="stylesheet" href="send.css"><script defer src="send.js"></script></head>
<body><main>
<h1>Home<span>TV</span></h1>
<p id="intro">Playlist-Link einfügen und an den Fernseher senden. Der Link wird hier auf dem Handy verschlüsselt; nur dein Fernseher kann ihn lesen.</p>
<form id="form" hidden>
<label for="link">Playlist-Link</label>
<input id="link" type="url" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="2000" required placeholder="https://…">
<button id="send" type="submit">An HomeTV senden</button>
</form>
<p id="status" role="status" aria-live="polite"></p>
<p class="small">Keine Speicherung auf dieser Seite. Übertragung über ntfy.sh, Ende-zu-Ende-verschlüsselt (AES-256-GCM).</p>
</main></body></html>
